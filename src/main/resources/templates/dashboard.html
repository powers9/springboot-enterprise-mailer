<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Dashboard')"></head>
<body>
    <div th:replace="layout :: navbar"></div>
    <div class="container-fluid px-4">
        <h1 class="mb-4 h2">Dashboard</h1>
        
        <div class="row mb-4">
            <div class="col-xl-3 col-md-6">
                <div class="card stat-card bg-primary text-white mb-4">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="h6 mb-0">Total Configs</div>
                            <div class="h2 mb-0" th:text="${configsCount}">0</div>
                        </div>
                        <i class="bi bi-gear fs-1 text-white-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="card stat-card bg-success text-white mb-4">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="h6 mb-0">Total Executions</div>
                            <div class="h2 mb-0" th:text="${logsCount}">0</div>
                        </div>
                        <i class="bi bi-play-circle fs-1 text-white-50"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">
                <i class="bi bi-table me-1"></i>
                Recent Executions
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Config ID</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Duration (ms)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${recentLogs}">
                            <td th:text="${log.id}">1</td>
                            <td th:text="${log.configId}">1</td>
                            <td th:text="${#temporals.format(log.triggeredTime, 'yyyy-MM-dd HH:mm:ss')}">2023-10-27 10:00:00</td>
                            <td>
                                <span th:if="${log.status == 'SUCCESS'}" class="badge bg-success">SUCCESS</span>
                                <span th:if="${log.status == 'FAILED'}" class="badge bg-danger">FAILED</span>
                            </td>
                            <td th:text="${log.executionDurationMs}">120</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(recentLogs)}">
                            <td colspan="5" class="text-center text-muted">No recent executions</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
