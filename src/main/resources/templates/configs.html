<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Configurations')"></head>
<body>
    <div th:replace="layout :: navbar"></div>
    <div class="container-fluid px-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 mb-0">Report Configurations</h1>
            <a href="/configs/new" class="btn btn-primary"><i class="bi bi-plus-lg"></i> New Config</a>
        </div>

        <div class="card">
            <div class="card-body">
                <table id="configsTable" class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Cron</th>
                            <th>Active</th>
                            <th>Formats</th>
                            <th>Last Run</th>
                            <th>Last Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="config : ${configs}">
                            <td th:text="${config.id}">1</td>
                            <td th:text="${config.reportName}">Report</td>
                            <td th:text="${config.cronExpression}">0 0 * * * ?</td>
                            <td>
                                <form th:action="@{/api/configs/toggle/{id}(id=${config.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm" th:classappend="${config.active} ? 'btn-success' : 'btn-secondary'">
                                        <i class="bi" th:classappend="${config.active} ? 'bi-toggle-on' : 'bi-toggle-off'"></i>
                                    </button>
                                </form>
                            </td>
                            <td th:text="${config.formats}">CSV,PDF</td>
                            <td th:text="${config.lastRunTime != null ? #temporals.format(config.lastRunTime, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                            <td>
                                <span th:if="${config.lastStatus == 'SUCCESS'}" class="badge bg-success">SUCCESS</span>
                                <span th:if="${config.lastStatus == 'FAILED'}" class="badge bg-danger">FAILED</span>
                                <span th:if="${config.lastStatus == null}" class="badge bg-secondary">PENDING</span>
                            </td>
                            <td>
                                <div class="btn-group">
                                    <form th:action="@{/api/configs/trigger/{id}(id=${config.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-info" title="Trigger Now"><i class="bi bi-play-fill"></i></button>
                                    </form>
                                    <a th:href="@{/configs/edit/{id}(id=${config.id})}" class="btn btn-sm btn-outline-warning"><i class="bi bi-pencil"></i></a>
                                    <form th:action="@{/api/configs/delete/{id}(id=${config.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        $(document).ready(function() {
            $('#configsTable').DataTable({
                "pageLength": 10,
                "order": [ [ 0, "desc" ] ],
                "language": {
                    "search": "_INPUT_",
                    "searchPlaceholder": "Search configurations..."
                }
            });
        });
    </script>
</body>
</html>
