<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Enterprise Mailer Report</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; background-color: #f9f9f9; padding: 20px;">
    <div style="background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto;">
        <h2 style="color: #4F46E5; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;">Automated Report: <span th:text="${reportName}">Report</span></h2>
        
        <p>Hello,</p>
        <p>Please find attached your requested report generated by the Enterprise Mailer System.</p>
        
        <table style="width: 100%; margin-top: 20px; border-collapse: collapse;">
            <tr>
                <td style="padding: 8px 0; font-weight: bold; width: 150px;">Report Name:</td>
                <td style="padding: 8px 0;" th:text="${reportName}">Name</td>
            </tr>
            <tr>
                <td style="padding: 8px 0; font-weight: bold;">Execution Time:</td>
                <td style="padding: 8px 0;" th:text="${#temporals.format(executionTime, 'yyyy-MM-dd HH:mm:ss')}">Time</td>
            </tr>
        </table>
        
        <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #f0f0f0; font-size: 12px; color: #999; text-align: center;">
            <p>This is an automated message. Please do not reply to this email.</p>
            <p>&copy; 2026 Enterprise Mailer System. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
