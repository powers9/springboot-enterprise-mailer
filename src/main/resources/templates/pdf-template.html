<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Report PDF</title>
    <style>
        body { font-family: sans-serif; font-size: 10pt; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #333; margin: 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${reportName}">Report Name</h1>
        <p>Generated at: <span th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></span></p>
    </div>
    
    <table>
        <thead>
            <tr>
                <th th:each="header : ${headers}" th:text="${header}">Header</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${data}">
                <td th:each="header : ${headers}" th:text="${row[header]}">Value</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
